name: ShopFlow CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Product Service ───────────────────────────────────────────
  product-service:
    name: Product Service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn clean verify -DskipTests=false --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-service-tests
          path: product-service/target/surefire-reports/

  # ─── Order Service ─────────────────────────────────────────────
  order-service:
    name: Order Service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn clean verify -DskipTests=false --no-transfer-progress

  # ─── Payment Service ───────────────────────────────────────────
  payment-service:
    name: Payment Service — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn clean verify -DskipTests=false --no-transfer-progress

  # ─── Notification Service ──────────────────────────────────────
  notification-service:
    name: Notification Service — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests --no-transfer-progress

  # ─── Stock Service ─────────────────────────────────────────────
  stock-service:
    name: Stock Service — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests --no-transfer-progress

  # ─── API Gateway ───────────────────────────────────────────────
  api-gateway:
    name: API Gateway — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests --no-transfer-progress

  # ─── Frontend ──────────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret-not-for-production
          NEXT_PUBLIC_API_URL: http://localhost:8080
          KEYCLOAK_CLIENT_ID: shopflow-frontend
          KEYCLOAK_CLIENT_SECRET: ""
          KEYCLOAK_ISSUER: http://localhost:8180/realms/shopflow
        run: npm run build

  # ─── Docker Compose validation ─────────────────────────────────
  docker-compose-validate:
    name: Docker Compose — Config Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ─── Summary ───────────────────────────────────────────────────
  ci-success:
    name: ✅ CI Success
    needs:
      - product-service
      - order-service
      - payment-service
      - notification-service
      - stock-service
      - api-gateway
      - frontend
      - docker-compose-validate
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "🎉 ShopFlow CI pipeline completed successfully!"
