apiVersion: v1
kind: ConfigMap
metadata:
  name: shopflow-config
  namespace: shopflow
  labels:
    app.kubernetes.io/part-of: shopflow
data:
  # Inter-service URLs (Kubernetes internal DNS)
  KEYCLOAK_URL: "http://keycloak:8080"
  PRODUCT_SERVICE_URL: "http://product-service:8081"
  ORDER_SERVICE_URL: "http://order-service:8082"
  PAYMENT_SERVICE_URL: "http://payment-service:8083"
  STOCK_SERVICE_URL: "http://stock-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8084"
  
  # Kafka & Redis
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  
  # Observability & Tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  
  # Frontend public variables
  NEXT_PUBLIC_API_URL: "http://localhost:8080"
  NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8180"
  NEXT_PUBLIC_KEYCLOAK_REALM: "shopflow"
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "shopflow-frontend"
---
apiVersion: v1
kind: Secret
metadata:
  name: shopflow-secrets
  namespace: shopflow
  labels:
    app.kubernetes.io/part-of: shopflow
type: Opaque
stringData:
  POSTGRES_USER: "shopflow"
  POSTGRES_PASSWORD: "shopflow"
  KEYCLOAK_DB_USER: "keycloak"
  KEYCLOAK_DB_PASSWORD: "keycloak"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: shopflow
  labels:
    app.kubernetes.io/part-of: shopflow
data:
  shopflow-realm.json: |
    {
      "realm": "shopflow",
      "enabled": true,
      "displayName": "ShopFlow",
      "displayNameHtml": "<b>ShopFlow</b>",
      "sslRequired": "external",
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "accessTokenLifespan": 900,
      "roles": {
        "realm": [
          { "name": "ROLE_ADMIN", "description": "Administrator role" },
          { "name": "ROLE_CUSTOMER", "description": "Customer role" }
        ]
      },
      "clients": [
        {
          "clientId": "shopflow-frontend",
          "name": "ShopFlow Frontend",
          "enabled": true,
          "publicClient": true,
          "redirectUris": ["http://localhost:3000/*", "http://localhost:8080/*", "*"],
          "webOrigins": ["http://localhost:3000", "http://localhost:8080", "*"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "shopflow-backend",
          "name": "ShopFlow Backend",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": true
        }
      ],
      "users": [
        {
          "username": "admin",
          "email": "admin@shopflow.com",
          "firstName": "Admin",
          "lastName": "ShopFlow",
          "enabled": true,
          "emailVerified": true,
          "credentials": [{ "type": "password", "value": "admin123", "temporary": false }],
          "realmRoles": ["ROLE_ADMIN"]
        },
        {
          "username": "customer",
          "email": "customer@shopflow.com",
          "firstName": "John",
          "lastName": "Doe",
          "enabled": true,
          "emailVerified": true,
          "credentials": [{ "type": "password", "value": "customer123", "temporary": false }],
          "realmRoles": ["ROLE_CUSTOMER"]
        }
      ]
    }
