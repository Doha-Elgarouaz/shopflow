# ─────────────────────────────────────────────────────────────
# PostgreSQL Databases for ShopFlow Microservices & Keycloak
# ─────────────────────────────────────────────────────────────

# --- Product DB ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-db-pvc
  namespace: shopflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
  namespace: shopflow
  labels:
    app: product-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "product_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: product-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: product-db-data
          persistentVolumeClaim:
            claimName: product-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: product-db
  namespace: shopflow
  labels:
    app: product-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: product-db

