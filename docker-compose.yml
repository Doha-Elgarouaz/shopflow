version: '3.8'

services:
  # ─── Keycloak ────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: shopflow-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - '8180:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      - keycloak-db
    networks:
      - shopflow-network

  keycloak-db:
    image: postgres:16-alpine
    container_name: shopflow-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - shopflow-network

  # ─── Kafka ───────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: shopflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - shopflow-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopflow-kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - shopflow-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopflow-kafka-ui
    ports:
      - '8090:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: shopflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - shopflow-network

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: shopflow-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - shopflow-network

  # ─── Databases ───────────────────────────────────────────────
  product-db:
    image: postgres:16-alpine
    container_name: shopflow-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - shopflow-network

  order-db:
    image: postgres:16-alpine
    container_name: shopflow-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - shopflow-network

  payment-db:
    image: postgres:16-alpine
    container_name: shopflow-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - shopflow-network

  notification-db:
    image: postgres:16-alpine
    container_name: shopflow-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - shopflow-network

  stock-db:
    image: postgres:16-alpine
    container_name: shopflow-stock-db
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    volumes:
      - stock-db-data:/var/lib/postgresql/data
    networks:
      - shopflow-network

  # ─── Observability ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: shopflow-jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    networks:
      - shopflow-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: shopflow-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - shopflow-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: shopflow-grafana
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - shopflow-network

  # ─── Services ────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: shopflow-api-gateway
    ports:
      - '8080:8080'
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: api-gateway
    depends_on:
      - keycloak
      - product-service
      - order-service
      - payment-service
    networks:
      - shopflow-network

  product-service:
    build: ./product-service
    container_name: shopflow-product-service
    ports:
      - '8081:8081'
    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: shopflow
      DB_PASSWORD: shopflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: product-service
    depends_on:
      - product-db
      - redis
      - kafka
      - keycloak
    networks:
      - shopflow-network

  order-service:
    build: ./order-service
    container_name: shopflow-order-service
    ports:
      - '8082:8082'
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: shopflow
      DB_PASSWORD: shopflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8083
      KEYCLOAK_URL: http://keycloak:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: order-service
    depends_on:
      - order-db
      - kafka
      - keycloak
    networks:
      - shopflow-network

  payment-service:
    build: ./payment-service
    container_name: shopflow-payment-service
    ports:
      - '8083:8083'
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: shopflow
      DB_PASSWORD: shopflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: payment-service
    depends_on:
      - payment-db
      - kafka
      - keycloak
    networks:
      - shopflow-network

  notification-service:
    build: ./notification-service
    container_name: shopflow-notification-service
    ports:
      - '8084:8084'
    environment:
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USER: shopflow
      DB_PASSWORD: shopflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: notification-service
    depends_on:
      - notification-db
      - kafka
    networks:
      - shopflow-network

  stock-service:
    build: ./stock-service
    container_name: shopflow-stock-service
    ports:
      - '8085:8085'
    environment:
      DB_HOST: stock-db
      DB_PORT: 5432
      DB_NAME: stock_db
      DB_USER: shopflow
      DB_PASSWORD: shopflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: stock-service
    depends_on:
      - stock-db
      - kafka
    networks:
      - shopflow-network

  frontend:
    build: ./frontend
    container_name: shopflow-frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8180
      NEXT_PUBLIC_KEYCLOAK_REALM: shopflow
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: shopflow-frontend
    depends_on:
      - api-gateway
    networks:
      - shopflow-network

networks:
  shopflow-network:
    driver: bridge

volumes:
  keycloak-db-data:
  product-db-data:
  order-db-data:
  payment-db-data:
  notification-db-data:
  stock-db-data:
  redis-data:
  grafana-data:
